<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; text-align: right; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { color: #2c3e50; }
        .content { font-size: 16px; color: #555; line-height: 1.6; }
        .btn { display: inline-block; padding: 12px 24px; margin: 20px 0; background-color: #3498db; color: #ffffff; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .footer { margin-top: 30px; font-size: 12px; color: #aaa; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>إعادة تعيين كلمة المرور</h2>
        </div>
        <div class="content">
            <p>مرحباً بك،</p>
            <p>استلمنا طلباً لإعادة تعيين كلمة المرور الخاصة بحسابك في {{AppName}}.</p>
            <p>إذا لم تقم بهذا الطلب، يمكنك تجاهل هذه الرسالة بأمان.</p>
            <div style="text-align: center;">
                <a href="{{ResetLink}}" class="btn">اضغط هنا لإعادة التعيين</a>
            </div>
            <p>أو يمكنك نسخ الرابط التالي في متصفحك:</p>
            <p dir="ltr" style="font-size: 13px; color: #3498db; word-wrap: break-word;">{{ResetLink}}</p>
        </div>
        <div class="footer">
            <p>&copy; {{AppName}}</p>
        </div>
    </div>
</body>
</html>
