# A database for development, and the whole API in a container when you want one.
#
#   docker compose up -d db       SQL Server only - for `npm run dev` against a container
#   docker compose up --build     SQL Server + the API on http://localhost:5000
#
# Settings come from .env. Nothing here is for production: it keeps the demo logins open
# on purpose.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # SQL Server refuses a weak one: 8+ characters with upper case, lower case, a digit
      # and a symbol, or the container exits on start.
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # Published on the loopback interface only, and off the default port so it never
    # collides with a SQL Server installed on the host.
    ports:
      - "127.0.0.1:${DB_PORT:-14339}:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      # The API's first act is to run migrations, so it must not start until the server
      # is actually answering queries.
      #
      # Five minutes of patience: the first start on a fresh volume builds the system
      # databases, and on a busy machine that alone can take a couple of minutes.
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CLIENT: mssql
      # The app creates the database itself if it is missing (repositories/sql/index.js).
      DATABASE_URL: mssql://sa:${DB_PASSWORD}@db:1433/app
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: express-api-template
      JWT_AUDIENCE: express-api-template-client
      APP_NAME: express-api-template
      FRONTEND_URL: http://localhost:5173

      # Nothing else creates the schema, so a fresh volume would leave the API answering
      # 500s. This is what makes `docker compose up` work from nothing.
      RUN_MIGRATIONS_ON_STARTUP: "true"

      # The image runs as production, where the app closes the demo accounts on start.
      # This stack is for development and demos, where signing in as admin@example.com is
      # the whole point - so this is the explicit opt-out. Never set it on a real deployment.
      SEED_DEMO_DATA: "true"
      KEEP_DEMO_LOGINS: "true"
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  db-data:
  uploads:
